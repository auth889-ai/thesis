# External live reference. Provider content is NEVER persisted (DECISION 1).
google_routes:
  enabled: false                  # READY_NOT_EXECUTED until a key exists
  provider_module: dhakaflow/live/google_providers.py::GoogleRoutesProvider
  corridors: DHAKA_R1_CORRIDORS   # 6 OD pairs across the frozen R1 region
  persist_raw: false              # OFF until operator reviews Google ToS on caching
  reality_label: REAL_LIVE
  secret_env_var: GOOGLE_MAPS_API_KEY   # NAME only, never a value
  persist: metadata_and_verdicts_only
  field_mask_excludes: [polyline, duration_text]
  classification: EXTERNAL_LIVE_REFERENCE   # not ground truth
camera_providers:
  vizzion:
    status: NOT_PURCHASED
    dhaka_coverage: NOT_LISTED    # verified 2026-08-14
    permitted_use: PROVIDER_INTEGRATION_VALIDATION   # e.g. Jakarta/Bangkok
    forbidden_use: DHAKA_LIVE_CAMERA_VALIDATION
    note: The Dhaka core must remain fully independent of Vizzion availability.
free_alternatives:
  - {name: 511NY, key: free, use: live-stream ingestion demonstration}
  - {name: TfL JamCams, key: free, liveness: UNVERIFIED}

google_weather:
  enabled: false                  # same key as Routes
  provider_module: dhakaflow/live/google_providers.py::GoogleWeatherProvider
  reality_label: REAL_LIVE
  claim_policy: exogenous candidate only — forecasting benefit requires ablation
reality_labels:
  enum: [REAL_LIVE, REAL_RECORDED, REAL_HISTORICAL, SIMULATED, DERIVED]
  enforcement: dhakaflow/common/reality.py — unlabelled observations cannot construct
