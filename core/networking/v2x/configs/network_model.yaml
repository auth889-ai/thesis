# The network model's parameters (core/networking/v2x/model.py). Every value has a source that was read, with the
# place in it. A parameter with `value: null` has no source yet: the model refuses that technology and names it.
# None of these sources measured Dhaka. They are other places' and laboratories' figures, used as stated;
# cellular_4g comes from one field study on a test track in Xi'an, China (Xu et al. 2017).
implementation: python        # the only one today; an ns-3 trace reader would be chosen here

message:                      # the same for every technology
  interval_s:
    value: 1.0
    source: "ETSI EN 302 637-2 V1.4.1 (2019-04), clause 6.1.3"
    quote: "The CAM generation interval shall not be superior to T_GenCamMax = 1 000 ms. This corresponds to the CAM generation rate of 1 Hz."
    note: "the slowest rate the standard allows; the simulation steps once a second, so a faster rate could not be represented"
  lifetime_s:
    value: 600.0
    source: "ETSI EN 302 637-3 V1.3.1 (2019-04), clause 8.2.1.5"
    quote: "the default offset of 600 s starting from the detectionTime, if the validityDuration is not provided by the application"

technologies:
  its_g5:                     # IEEE 802.11p. The field figures are for DSRC, the same radio standard as used in the United States
    provenance: "5GAA proving-ground tests (P-190033, 2018): range and reception from a test track with a blocking vehicle, delay from a cabled laboratory test; not Dhaka"
    hops: {value: 1, source: "direct vehicle-to-vehicle broadcast; no network in between (the technology's definition)"}
    range_m:
      value: 425.0
      source: "5GAA P-190033, V2X Functional and Performance Test Report, Table 36 (11 dBm transmit power), row Non-Line-of-Sight (NLOS) Blocker (5GAA): DSRC"
      quote: "Range in (m) at 90% reliability ... Non-Line-of Sight (NLOS) Blocker (5GAA) 425"
      note: "a proving-ground test with a blocking vehicle, at reduced transmit power; line of sight in the same table is 925 m. The blocked figure is used because city traffic blocks the path"
    delivery_ratio_in_range:
      value: 0.90
      source: "5GAA P-190033, section 8.5"
      quote: "The PRR threshold for range determination is 90%."
      note: "the reception ratio that defines the range above, so a lower bound inside it; beyond the range the model delivers nothing, although the report shows some reception continuing"
    delay_s:
      value: 0.0162
      source: "5GAA P-190033, Annex C, Table 48 (Summary of Average Latency Results), test 7.2.2: DSRC"
      quote: "Average Latency (ms) ... 7.2.2 Cabled transmission and reception test with varying payload sizes 14 16.2"
      note: "a cabled laboratory test of 193-byte messages. Our own MOSAIC Barnim run gives a median of 1.9 ms for ITS-G5, but that is a simulator's figure and is not used here"
  c_v2x:                      # LTE-V2X sidelink (PC5), direct
    provenance: "5GAA proving-ground tests (P-190033, 2018): range and reception from a test track with a blocking vehicle, delay from a cabled laboratory test; not Dhaka"
    hops: {value: 1, source: "direct vehicle-to-vehicle sidelink; no network in between (the technology's definition)"}
    range_m:
      value: 625.0
      source: "5GAA P-190033, Table 36 (11 dBm transmit power), row Non-Line-of-Sight (NLOS) Blocker (5GAA): C-V2X"
      quote: "Range in (m) at 90% reliability ... Non-Line-of Sight (NLOS) Blocker (5GAA) 425 625/725"
      note: "the first of the two crossings of 90 % the report gives; line of sight is >1350 m (the end of the track)"
    delivery_ratio_in_range:
      value: 0.90
      source: "5GAA P-190033, section 8.5"
      quote: "The PRR threshold for range determination is 90%."
      note: "as for its_g5"
    delay_s:
      value: 0.014
      source: "5GAA P-190033, Annex C, Table 48, test 7.2.2: C-V2X"
      quote: "Average Latency (ms) ... 7.2.2 Cabled transmission and reception test with varying payload sizes 14 16.2"
      note: "cabled laboratory test"
  cellular_4g:                # plain LTE through the mobile network: ambulance -> network -> vehicle
    provenance: "one field study: Xu et al. 2017, a test-bed LTE network on a university test track in Xi'an, China, one vehicle pair at 60 km/h (packet loss 4 %); delay from a public LTE network in Germany (tinyLTE, 2018); not Dhaka"
    hops: {value: 2, source: "the message goes up to the network and down to the receiver: two radio legs (the technology's definition)"}
    range_m:
      value: .inf
      source: "no direct radio link: reach is the mobile network's coverage, which this model does not represent"
    delivery_ratio_in_range:
      value: 0.96             # 1 - 0.04: the packet loss rate the text states at 60 km/h, the lowest speed it gives a number for
      source: "Xu, Li, Zhao, Zhang, Wang, DSRC versus 4G-LTE for Connected Vehicle Applications: A Study on Field Experiments of Vehicular Communication Performance, J. Advanced Transportation 2017, doi:10.1155/2017/2750452, section 4.1 (page 5) and Figure 8(a) (page 8), Scenario I (Collision Avoidance, vehicle to vehicle through the LTE network)"
      quote: "From Figure 8(a), it can be found that the average PLR of LTE jumps from 4% to 7.5% when the velocity of vehicles changes from 60 Km/h to 90 Km/h, while the average PLR of DSRC changes slightly."
      note: "ONE FIELD STUDY, NOT DHAKA: a test-bed LTE network (eNode-B, CPE, core) at Chang'an University, Xi'an, China, one test vehicle pair, 2017 equipment. Figure 8(a) also plots about 3 % at 30 km/h, but that value is read off a chart and is not used; the 60 km/h figure stated in the text is. Scenario II (vehicle to roadside through LTE, Figure 10(a), page 7): \"the average PLR of LTE jumps from 1.7% to 3.5% when the velocity of vehicles changes from 30 Km/h to 90 Km/h\"; not used, because the ambulance alert is vehicle to vehicle"
    delay_s:
      value: 0.0375
      source: "Eckermann, Gorczak, Wietfeld, tinyLTE: Lightweight, Ad Hoc Deployable Cellular Network for Vehicular Communication, IEEE VTC-Spring 2018 (arXiv:1802.09262), section V"
      quote: "Our latency measurements in a public LTE radio network yielded an average of 37.5 ms."
      note: "one way, half of a measured round trip, in a public network in Germany; per hop. Xu et al. 2017 give round-trip ping times only: Scenario I, Figure 8(b) (page 8), LTE about 310 to 410 ms over 30 to 120 km/h (read off the chart; the text, page 6, says only that it is \"higher than 100 milliseconds\"); Scenario II, page 8: \"exceeds 50 Km/h, the average RTT of LTE is beyond 100 milliseconds and achieves 150 milliseconds at 120 Km/h\". A round trip of a vehicle-to-vehicle ping crosses four radio legs; splitting it into one-way legs would be our assumption, so the value is not taken from there. Xu's round trips are 2 to 3 times longer than four of these 37.5 ms legs, so this delay is on the optimistic side. With one-second simulation steps neither value changes a result"
  ideal:                      # for tests only: everything arrives at once
    hops: {value: 1, source: "test fixture"}
    range_m: {value: .inf, source: "test fixture"}
    delivery_ratio_in_range: {value: 1.0, source: "test fixture"}
    delay_s: {value: 0.0, source: "test fixture"}
  none:                       # for tests and the no-alert arm: nothing arrives
    hops: {value: 1, source: "test fixture"}
    range_m: {value: 0.0, source: "test fixture"}
    delivery_ratio_in_range: {value: 0.0, source: "test fixture"}
    delay_s: {value: 0.0, source: "test fixture"}
