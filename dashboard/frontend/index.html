<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DhakaFlow</title>
<link rel="stylesheet" href="/static/styles/app.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">Dhaka<span>Flow</span></div>
    <nav>
      <div class="navgroup">Operate</div>
      <button data-page="mission" aria-current="true">Mission Control</button>
      <button data-page="live">Live Traffic</button>
      <button data-page="forecast">Forecast</button>
      <button data-page="advisor">Route Optimizer</button>
      <button data-page="counterfactual">SUMO Twin</button>
      <div class="navgroup">Research</div>
      <button data-page="city">Cities</button>
      <button data-page="crosscity">Cross-City AI</button>
      <button data-page="network">Federated / V2X</button>
      <button data-page="research">Evidence &amp; Methodology</button>
    </nav>
    <div class="conn">
      <div><span class="dot offline" id="dot"></span><span id="conn-label">connecting…</span></div>
      <button id="theme" style="margin-top:10px;width:100%;background:none;border:1px solid var(--line);
        color:var(--ink-muted);border-radius:8px;padding:6px;cursor:pointer;font:inherit">Toggle theme</button>
    </div>
  </aside>
  <main>
    <header class="page"><h1 id="title">Live Traffic</h1><p id="subtitle"></p></header>
    <div id="outlet"></div>
  </main>
</div>
<script type="module" src="/static/app.js"></script>
</body>
</html>
