<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrafficTwin</title>
<link rel="stylesheet" href="/static/styles/app.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><span class="brand-mark">TT</span><span>TrafficTwin</span><small>PREDICTION · ROUTING · SIMULATION · V2X</small></div>
    <nav>
      <button data-page="mission" aria-current="true">Home</button>
      <button data-page="predict">Prediction</button>
      <button data-page="advisor">Route Optimization</button>
      <button data-page="twin">Digital Twin</button>
      <button data-page="results">Results</button>
      <details class="navgroup-research">
        <summary>Research</summary>
        <button data-page="network">Networking · V2X</button>
        <button data-page="forecast">Dhaka Forecast Lab</button>
        <button data-page="crosscity">Cross-City AI</button>
        <button data-page="research">Evidence</button>
        <button data-page="city">Cities</button>
        <button data-page="archive">Archived Experiments</button>
      </details>
    </nav>
    <div class="conn">
      <div><span class="dot offline" id="dot"></span><span id="conn-label">connecting…</span></div>
      <button id="theme" class="theme-button"><i data-lucide="sun-moon"></i><span>Theme</span></button>
    </div>
  </aside>
  <main>
    <header class="page"><h1 id="title">Live Traffic</h1><p id="subtitle"></p></header>
    <div id="outlet"></div>
  </main>
</div>
<script type="module" src="/static/app.js"></script>
</body>
</html>
