[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "traffictwin"
version = "0.1.0"
description = "Traffic forecasting (ML/DL), route optimization, simulated V2X networking and a SUMO digital twin — the domain library"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["traffictwin*"]

[tool.setuptools.package-data]
traffictwin = ["**/*.json", "**/*.yaml", "**/*.xml", "**/*.sha256"]
