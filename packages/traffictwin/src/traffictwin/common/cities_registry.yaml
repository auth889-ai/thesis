# City capability registry — a city NEVER claims an actuator it doesn't have.
# MODE1 OBSERVE_ONLY:     sense -> forecast -> simulate -> recommend
# MODE2 SIGNAL_CONNECTED: + real traffic-light commands (needs authority link)
# MODE3 V2X_CONNECTED:    + LTE/C-V2X pipeline/routing/speed commands to vehicles
schema: 1
adapters:   # contract names; implementations in research/ + dhakaflow/
  camera: research/perception/pipeline.py
  traffic_api: dhakaflow/live/road511_provider.py
  network: research/networking/v2x_bus.py           # latency: measured (MOSAIC)
  signal_controller: research/control/signal_baselines.py   # twin-side actuator
  vehicle_control: research/networking/v2x_bus.py           # SPEED_TARGET/ROUTE_ADVISORY

cities:
  dhaka:
    mode: OBSERVE_ONLY
    twin: paper_labs/02_dhaka_osm/outputs/lab02_v2/network/dhaka_r1.net.xml
    cameras: AWAITING_REAL_FEED (registry: packages/traffictwin/src/traffictwin/perception/configs/cameras_registry.json)
    note: reference corridor for decision demos; no physical actuator claimed
  denver_cdot:
    mode: OBSERVE_ONLY
    traffic_api: road511 (ACTIVE key; live snapshots verified)
    cameras: [070E28355CAM1RP2, 025N19940CAM1NWC]
    note: real live sensing works today; no actuator access claimed
  any_city:
    mode: OBSERVE_ONLY
    note: generic unmapped-site mode (declared reference-corridor twin)
# MODE2/MODE3 rows appear ONLY when a real authority/vehicle connection exists.
