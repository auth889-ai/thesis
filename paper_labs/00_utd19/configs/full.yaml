# Canonical parameters for the Lab 00 Stage-1 PAPER_FAITHFUL experiment
# (full torino set — the lab's "full" experiment; the multi-city extension would
# be a later, separately-approved run).
# The CONFIG cell of notebooks/Lab00_UTD19_PaperFaithful_Colab.ipynb must mirror
# these values; tests/test_configs_match.py enforces the match. Change here
# first, then rebuild (python3 src/build_stage1_notebook.py).
drive_root: /content/drive/MyDrive/DhakaFlow-Nexus-Data/Lab00_UTD19
city: torino
seed: 42
n_draws: 300          # PUBLISHED (Loder et al. Methods)
sample_frac: 0.80     # PUBLISHED
quantiles: [0.95, 0.975]   # PUBLISHED band; both fitted (sensitivity)
k_bin_width_candidates: [2.0, 4.0]  # ASSUMED -> sensitivity
min_detectors_per_interval: 10
freeflow_speed_pct: 0.85   # ASSUMED
freeflow_occ_pct: 0.10     # ASSUMED
min_valid_intervals_per_detector: 500  # ASSUMED
duckdb_memory_limit: 8GB
