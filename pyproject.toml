[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "traffictwin"
version = "0.1.0"
description = "Evidence-first traffic forecasting, V2X simulation, and routing research"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["traffictwin*"]
exclude = ["*.tests*", "*.cache*", "*.__pycache__*"]
namespaces = true

[tool.setuptools.package-data]
traffictwin = ["protocols/controller_config.json", "optimization/routing_config.json", "nlp/gazetteer.json", "networking/mosaic/logback_sweep.xml"]
