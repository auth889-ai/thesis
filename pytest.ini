[pytest]
pythonpath = src .
# `pytest` with no arguments must mean the same thing as `make test`: the active suites only.
# legacy/ and paper_labs/ carry their own retired or frozen test trees and are never collected here.
testpaths = tests backend/tests
norecursedirs = legacy paper_labs upstream results data cache notebooks .git __pycache__
markers =
    slow: long SUMO smoke tests (run with -m slow)
