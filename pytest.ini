[pytest]
pythonpath = packages/traffictwin/src apps/api .
# `pytest` with no arguments == `make test`: library tests, API tests and the cross-cutting platform tests.
testpaths = packages/traffictwin/tests apps/api/tests tests
norecursedirs = upstream results data cache .git __pycache__ node_modules
markers =
    slow: long SUMO smoke tests (run with -m slow)
