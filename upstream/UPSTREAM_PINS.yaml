  # -------------------------------------------------- federated forecasting
  # Core research question: how do realistic V2X communication constraints
  # affect DISTRIBUTED traffic forecasting accuracy, and how does that
  # degradation propagate into prediction-aware routing? These two are the
  # official baselines that question is measured against. Upstream-first:
  # reproduce the authors' own benchmark BEFORE any impairment adapter is
  # attached, and record REPRODUCTION_PASS/FAIL.

  - name: CNFGNN
    subsystem: federated_forecasting
    url: https://github.com/mengcz13/KDD2021_CNFGNN.git
    ref: main
    sha: 505660846e046ab5890d1450b918b8fe9317bd46
    verified: "2026-09-02"
    status: PINNED_NOT_FETCHED
    paper: https://arxiv.org/abs/2106.05223
    venue: KDD 2021
    why: Cross-Node Federated Graph Neural Network - the reference federated
         spatio-temporal forecasting method. Splits temporal modelling (on
         node) from spatial modelling (on server) with alternating training,
         so its communication cost is a first-class quantity. This is the
         baseline our impairment study degrades; we do not reimplement it.

  - name: FedGTP
    subsystem: federated_forecasting
    url: https://github.com/LarryHawkingYoung/KDD2024_FedGTP.git
    ref: main
    sha: ff128f5bed7780b384776d03fe0bad8110575a64
    verified: "2026-09-02"
    status: PINNED_NOT_FETCHED
    paper: https://doi.org/10.1145/3637528.3672054
    venue: KDD 2024
    why: Federated Graph-based Traffic Prediction exploiting inter-client
         spatial dependency - the current federated traffic-forecasting
         baseline. Compared against CNFGNN and FedAvg under identical
         communication impairment profiles.

