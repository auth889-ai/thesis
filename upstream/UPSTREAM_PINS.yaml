    subsystem: perception
    url: https://github.com/lyuwenyu/RT-DETR.git
    ref: main
    sha: 068dfde65f2667ad6555883c69d73de886518cad
    verified: "2026-08-14"
    status: FETCHED
    paper: https://arxiv.org/abs/2304.08069
    venue: CVPR 2024
    license: Apache-2.0       # to re-confirm from LICENSE file at fetch
    why: Official RT-DETR (v1/v2). Detector candidate; official configs and
         training pipeline are used unmodified.

  - name: BNVD
    subsystem: perception
    url: https://github.com/bipin-saha/BNVD.git
    ref: main
    sha: b4e74d17dc089af5ffe81c9a29c6b4dbdf59ff6f
    verified: "2026-08-14"
    status: FETCHED
    paper: https://arxiv.org/abs/2405.12150
    dataset_download: https://www.kaggle.com/datasets/sahabipin/bangladeshi-native-vehicle-dataset
    license: UNSPECIFIED      # README License section is EMPTY — blocker before use
    sparse_paths: [docs, notebooks, Tools, Stats]   # never fetch checkpoints locally
    why: >
      Authoritative BNVD class-index order is read from
      Tools/annotation_counter.py (class_list), never guessed from the README.
      versions.txt pins the exact upstream commits the authors benchmarked:
      yolov5 b599ae42d9adb8bcb96a1de6ad093436aac9fe6b,
      yolov6 e86a483f3f6bded25d45970b56831345a99744a4,
      yolov7 a207844b1ce82d204ab36d87d496728d3d2348e7,
      ultralytics 8.2.2.

