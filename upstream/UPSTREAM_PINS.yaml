  - name: LibSignal
    subsystem: control
    url: null                 # repo URL to fresh-verify at gate open
    paper: https://arxiv.org/pdf/2211.10649
    verified: "2026-08-14"
    status: PINNED
    license: GPL-3.0
    license_risk: HIGH
    why: >
      Cross-simulator TSC library (IDQN, CoLight, PressLight). GPL-3.0 is viral:
      it may be executed as an ISOLATED BENCHMARK PROCESS, but must never be
      imported into the DhakaFlow runtime, which would impose GPL on the whole
      platform.

