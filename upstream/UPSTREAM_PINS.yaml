# DhakaFlow upstream pins — MANIFESTS ONLY.
#
# HARD RULE: official research code is never committed into this repository and
# never modified. This file records *what* to fetch and *at which exact commit*.
# `pipeline/upstream/fetch_upstream.py` clones each entry into the gitignored external
# workspace ($DHAKAFLOW_WORKSPACE, default ~/.dhakaflow/upstream) and verifies
# the checked-out SHA matches this file before the code may be used.
#
# `verified` is the date we confirmed the URL and SHA resolve. Re-verify when a
# component's gate opens — never trust a pin written months earlier.
#
# status: PINNED (recorded) | FETCHED (present in workspace, SHA verified)
#         | USED (an adapter actually imports/executes it)

schema_version: 1

workspace_env_var: DHAKAFLOW_WORKSPACE
workspace_default: ~/.dhakaflow/upstream

