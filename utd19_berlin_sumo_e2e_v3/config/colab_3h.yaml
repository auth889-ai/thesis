# Whole official UTD19 dataset, sized to finish on one Colab session (~3 h).
#
# "Full dataset" here means step 02 streams and aggregates ALL 169,032,955
# published UTD19 measurement rows. Only the model-fitting step works on a
# reproducible reservoir sample of the resulting hourly table, because a
# Decision Tree / Random Forest over every hourly row needs far more RAM than
# a Colab VM has. Every cap below is written into training_protocol.json.
#
# Runtime is dominated by four stages: the 6.98 GB download, the DuckDB
# aggregation, routeSampler, and the 24 h simulation. Use a High-RAM runtime.
mode: full_colab
workspace: /content/utd19_berlin_e2e
seed: 42
resume: true

utd19:
  use_official_full_dataset: true
  target_mode: detector_total
  hourly_aggregation: mean
  strict_error_filter: true
  # Reservoir sample shared by every model. null = every hourly row (needs a
  # high-memory VM; expect the tree models to be the first thing to die).
  model_max_rows: 5000000
  polynomial_max_rows: 400000
  linear_svm_max_rows: 400000
  random_forest_max_rows: 2000000
  random_forest_trees: 120
  include_city_features: false

berlin:
  year: 2021
  month: 2
  # The five weekdays plotted in the paper's Figure 4.
  actual_dates: [2021-02-02, 2021-02-03, 2021-02-04, 2021-02-05, 2021-02-06]
  prediction_date: 2021-02-03
  max_detectors: null
  detector_ids: []
  archive_branch_regex: "Messquerschnitte/mq_hr"
  quality_valid_values: [1, "1", 1.0]
  minimum_id_match_ratio: 0.5

osm:
  source_url: https://download.geofabrik.de/europe/germany/berlin-latest.osm.pbf
  use_bundled_demo_network: false
  keep_vehicle_class: passenger
  # Keep the whole Berlin extract, as the paper does. Set true (and tune the
  # buffer) if netconvert runs out of memory on a standard runtime.
  clip_to_detector_bbox: false
  detector_bbox_buffer_km: 4

mapping:
  search_radius_m: 150
  max_candidates: 8
  direction_weight: 2.0
  distance_weight: 1.0
  name_weight: 1.0
  # Colab cannot show the review UI mid-run; the notebook passes
  # --accept-auto-mapping and writes mapping_review.html for inspection after.
  require_manual_acceptance: false

candidates:
  # The paper never publishes its candidate counts. These are ~3x smaller than
  # config/full.yaml so duarouter and routeSampler fit the session budget.
  random_route_count: 80000
  taz_route_count: 40000
  coverage_routes_per_detector: 30
  taz_grid_m: 4000
  routing_random_factor: 1.8

route_sampler:
  optimize: full
  threads: 4
  write_flows: number
  merge_same_edge: max

simulation:
  begin: 0
  end: 86400
  step_length: 1
  time_to_teleport: 900
  scale_counts: 1.0
  gui_delay_ms: 10
