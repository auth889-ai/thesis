mode: subset
workspace: /content/utd19_berlin_e2e_subset
seed: 42
resume: true

utd19:
  use_official_full_dataset: true
  target_mode: detector_total
  hourly_aggregation: mean
  strict_error_filter: true
  model_max_rows: 2000000
  polynomial_max_rows: 300000
  linear_svm_max_rows: 750000
  random_forest_max_rows: 2000000
  random_forest_trees: 150
  include_city_features: false

berlin:
  year: 2021
  month: 2
  actual_dates: [2021-02-02, 2021-02-03, 2021-02-04, 2021-02-05, 2021-02-06]
  prediction_date: 2021-02-03
  max_detectors: 30
  detector_ids: []
  archive_branch_regex: "Messquerschnitte/mq_hr"
  quality_valid_values: [1, "1", 1.0]
  minimum_id_match_ratio: 0.5

osm:
  source_url: https://download.geofabrik.de/europe/germany/berlin-latest.osm.pbf
  use_bundled_demo_network: false
  keep_vehicle_class: passenger
  clip_to_detector_bbox: true
  detector_bbox_buffer_km: 4

mapping:
  search_radius_m: 120
  max_candidates: 5
  direction_weight: 2.0
  distance_weight: 1.0
  name_weight: 1.0
  require_manual_acceptance: true

candidates:
  random_route_count: 30000
  taz_route_count: 20000
  coverage_routes_per_detector: 30
  taz_grid_m: 2500
  routing_random_factor: 1.7

route_sampler:
  optimize: full
  threads: 2
  write_flows: number
  merge_same_edge: max

simulation:
  begin: 0
  end: 86400
  step_length: 1
  time_to_teleport: 600
  scale_counts: 1.0
  gui_delay_ms: 20
